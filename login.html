<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Impuestos</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            --header-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #f8fafc;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            color: #0f172a;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .login-header {
            background: var(--primary-gradient);
            color: white;
            padding: 2rem 2rem 1.75rem;
            text-align: center;
            position: relative;
        }

        .login-header .icon-brand {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            margin-bottom: 0.85rem;
            backdrop-filter: blur(8px);
        }

        .login-header h4 {
            font-weight: 700;
            margin-bottom: 0.25rem;
            letter-spacing: -0.5px;
        }

        .login-header p {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.85);
            margin: 0;
        }

        .login-body {
            padding: 2.25rem 2rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 0.35rem;
        }

        .form-control {
            border-radius: 12px;
            border: 1.5px solid #cbd5e1;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        .input-group-text {
            border-radius: 12px;
            border: 1.5px solid #cbd5e1;
            background-color: #f8fafc;
            color: #64748b;
        }

        .btn-login {
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.85rem;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        .btn-login:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
            color: white;
        }

        .badge-hint {
            background-color: #f1f5f9;
            border: 1px dashed #cbd5e1;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.8rem;
            color: #64748b;
        }

        .alert-custom {
            border-radius: 12px;
            font-size: 0.9rem;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <!-- Encabezado del Formulario -->
        <div class="login-header">
            <div class="icon-brand">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h4>Acceso al Sistema</h4>
            <p>Sistema de Impuestos a Actividades Económicas</p>
        </div>

        <!-- Cuerpo del Formulario -->
        <div class="login-body">
            
            <!-- Mensaje de Alerta -->
            <div id="alertLogin" class="alert alert-custom mb-3" role="alert">
                <div class="d-flex align-items-center gap-2">
                    <i id="alertIcon" class="bi fs-5"></i>
                    <div id="alertText"></div>
                </div>
            </div>

            <form id="frmLogin" autocomplete="off">
                <!-- Campo: Usuario -->
                <div class="mb-3">
                    <label for="txtUsuarioLogin" class="form-label">
                        <i class="bi bi-person-fill text-primary me-1"></i> Usuario
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-at"></i></span>
                        <input type="text" class="form-control" id="txtUsuarioLogin" name="txtUsuarioLogin" 
                               placeholder="Ingrese su nombre de usuario" required autofocus maxlength="35">
                    </div>
                </div>

                <!-- Campo: Clave -->
                <div class="mb-4">
                    <label for="txtClaveLogin" class="form-label">
                        <i class="bi bi-key-fill text-primary me-1"></i> Contraseña
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="txtClaveLogin" name="txtClaveLogin" 
                               placeholder="Ingrese su contraseña" required maxlength="35">
                        <button class="btn btn-outline-secondary" type="button" id="btnToggleClave" onclick="toggleClave()">
                            <i class="bi bi-eye" id="iconEye"></i>
                        </button>
                    </div>
                </div>

                <!-- Botón de Inicio de Sesión -->
                <button type="submit" id="btnSubmitLogin" class="btn btn-login mb-3 d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-box-arrow-in-right"></i>
                    <span id="lblBtnLogin">Iniciar Sesión</span>
                </button>

                <!-- Enlace a Registro de Usuarios -->
                <div class="text-center mb-3">
                    <a href="/usuarios.html" class="text-decoration-none fw-semibold text-primary small">
                        <i class="bi bi-person-plus me-1"></i> ¿No tienes usuario? Registrar nuevo usuario
                    </a>
                </div>

                <!-- Indicador de credenciales de prueba -->
                <div class="badge-hint text-center">
                    <div class="fw-semibold text-dark mb-1">
                        <i class="bi bi-info-circle-fill text-primary me-1"></i> Credenciales Iniciales
                    </div>
                    Usuario: <code class="fw-bold text-primary">admin</code> | Clave: <code class="fw-bold text-primary">admin123</code>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Validación y Comunicación con Python -->
    <script>
        const frmLogin = document.getElementById('frmLogin');
        const txtUsuarioLogin = document.getElementById('txtUsuarioLogin');
        const txtClaveLogin = document.getElementById('txtClaveLogin');
        const btnSubmitLogin = document.getElementById('btnSubmitLogin');
        const lblBtnLogin = document.getElementById('lblBtnLogin');
        const alertLogin = document.getElementById('alertLogin');
        const alertText = document.getElementById('alertText');
        const alertIcon = document.getElementById('alertIcon');

        function toggleClave() {
            const iconEye = document.getElementById('iconEye');
            if (txtClaveLogin.type === 'password') {
                txtClaveLogin.type = 'text';
                iconEye.className = 'bi bi-eye-slash';
            } else {
                txtClaveLogin.type = 'password';
                iconEye.className = 'bi bi-eye';
            }
        }

        frmLogin.addEventListener('submit', async (e) => {
            e.preventDefault();

            const usuario = txtUsuarioLogin.value.trim();
            const clave = txtClaveLogin.value.trim();

            if (!usuario || !clave) {
                mostrarAlerta('Por favor ingrese tanto el usuario como la clave.', 'warning');
                return;
            }

            // Deshabilitar botón durante la petición
            btnSubmitLogin.disabled = true;
            lblBtnLogin.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Verificando...`;

            try {
                // Enviar datos al endpoint /login en Python
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ usuario, clave })
                });

                const resultado = await response.json();

                if (resultado.acceso === true) {
                    // Acceso concedido
                    mostrarAlerta(`¡Bienvenido, ${resultado.usuario.nombre}! Acceso concedido.`, 'success');
                    
                    // Almacenar datos de sesión en sessionStorage
                    sessionStorage.setItem('usuarioActivo', JSON.stringify(resultado.usuario));

                    // Redireccionar al sistema principal tras breve pausa
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 1000);
                } else {
                    // Acceso denegado (usuario o clave no existen en usss090525)
                    mostrarAlerta(resultado.msg || 'Acceso denegado: Usuario o contraseña no registrados en el sistema.', 'danger');
                    btnSubmitLogin.disabled = false;
                    lblBtnLogin.innerText = 'Iniciar Sesión';
                }
            } catch (error) {
                console.error('Error al intentar iniciar sesión:', error);
                mostrarAlerta('Error de conexión con el servidor Python.', 'danger');
                btnSubmitLogin.disabled = false;
                lblBtnLogin.innerText = 'Iniciar Sesión';
            }
        });

        function mostrarAlerta(mensaje, tipo = 'danger') {
            alertLogin.className = `alert alert-${tipo} alert-custom mb-3`;
            alertText.innerText = mensaje;
            if (tipo === 'success') {
                alertIcon.className = 'bi bi-check-circle-fill text-success fs-5';
            } else if (tipo === 'warning') {
                alertIcon.className = 'bi bi-exclamation-triangle-fill text-warning fs-5';
            } else {
                alertIcon.className = 'bi bi-x-circle-fill text-danger fs-5';
            }
            alertLogin.style.display = 'block';
        }
    </script>
</body>

</html>
